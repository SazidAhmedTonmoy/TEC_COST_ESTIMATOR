name: Deploy TEC ConEst to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tec-conest-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DEPLOY_PATH: /home/ampecportal/tec-const.ampecportal.com
      SITE_URL: https://tec-const.ampecportal.com
      SSH_HOST: ${{ secrets.CPANEL_HOST }}
      SSH_USER: ${{ secrets.CPANEL_USER }}
      SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Validate application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q app.py conest_app
          python -m unittest discover -s tests -v

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing one or more required GitHub secrets: CPANEL_HOST, CPANEL_USER, CPANEL_SSH_KEY"
            exit 1
          fi

          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tec_conest_deploy_key
          chmod 600 ~/.ssh/tec_conest_deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      # The application creates a protected SQLite snapshot immediately before
      # migrating the REAL runtime database. No deployment step copies a .db.

      - name: Upload application code
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/tec_conest_deploy_key -p $PORT" \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.db' \
            --exclude '*.db-*' \
            --exclude '*.db.*' \
            --exclude '*.sqlite*' \
            --exclude '.github/' \
            --exclude '.well-known/' \
            --exclude '.htaccess' \
            --exclude 'passenger_wsgi.py' \
            --exclude 'venv/' \
            --exclude '.venv/' \
            --exclude 'tmp/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.log' \
            --exclude 'data/' \
            --exclude 'data/conest_catalog.db' \
            --exclude 'data/conest_catalog.db-wal' \
            --exclude 'data/conest_catalog.db-shm' \
            --exclude 'data/conest_catalog.db-journal' \
            --exclude 'data/backups/' \
            --exclude 'data/imports/' \
            --exclude 'data/exports/' \
            --exclude 'data/import_previews/' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Install production dependencies and restart Passenger
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"

          ssh -i ~/.ssh/tec_conest_deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "set -e; \
             cd '$DEPLOY_PATH'; \
             sh tools/install_runtime.sh; \
             mkdir -p tmp; \
             touch tmp/restart.txt; \
             echo 'Passenger restart requested.'"

      - name: Verify automatic migration and production health
        run: |
          set -euo pipefail
          for ATTEMPT in $(seq 1 18); do
            RESPONSE="$(curl -fsS --connect-timeout 15 --max-time 150 "$SITE_URL/api/health" || true)"
            if printf '%s' "$RESPONSE" | python -c 'import json,sys; r=json.load(sys.stdin); sys.exit(0 if r.get("status")=="ok" and r.get("release")=="2.3.2" and r.get("schema_version")==24 else 1)' 2>/dev/null; then
              echo "$RESPONSE"
              echo 'Updated code is serving traffic and the runtime database has migrated.'
              exit 0
            fi
            echo "Waiting for the updated Passenger worker and database (attempt $ATTEMPT/18)."
            sleep 5
          done
          echo "$RESPONSE"
          echo 'Updated application or automatic database migration is not ready. Check Passenger logs.' >&2
          exit 1
