name: Deploy TEC Flow to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tec-conest-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The default matches the existing application shown in cPanel.
      DEPLOY_PATH: ${{ vars.CPANEL_DEPLOY_PATH || secrets.CPANEL_DEPLOY_PATH || '/home/ampecportal/tec-flow.ampecportal.com' }}
      DEPLOY_PATH_SECRET: ${{ secrets.CPANEL_DEPLOY_PATH || '' }}
      SITE_URL: ${{ vars.CPANEL_SITE_URL || 'https://tec-flow.ampecportal.com' }}
      SSH_HOST: ${{ secrets.CPANEL_HOST }}
      SSH_USER: ${{ secrets.CPANEL_USER }}
      SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Check retired AI source cleanup
        run: python tools/cleanup_retired_ai.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build Tenders
        working-directory: tenders_frontend
        run: npm ci && npm run build

      - name: Validate application
        run: |
          pip install -r requirements.txt
          python tools/build_frontend.py
          python tools/check_secrets.py
          python -m compileall -q app.py conest_app
          node --test tests/browser_contact_ocr.test.mjs tests/contact_screenshot_ui.test.mjs tests/tender_notifications.test.mjs
          python tools/run_tests.py --workers 4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST:-}" ] || [ -z "${SSH_USER:-}" ] || [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing one or more required GitHub secrets: CPANEL_HOST, CPANEL_USER, CPANEL_SSH_KEY"
            exit 1
          fi

          PORT="${SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/tec_conest_deploy_key
          chmod 600 ~/.ssh/tec_conest_deploy_key
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Resolve and validate the cPanel application
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          # GitHub expressions treat whitespace as non-empty. Ignore blank
          # overrides before falling back to the verified application folder.
          if [ -z "${DEPLOY_PATH//[[:space:]]/}" ]; then
            DEPLOY_PATH="${DEPLOY_PATH_SECRET:-}"
          fi
          if [ -z "${DEPLOY_PATH//[[:space:]]/}" ]; then
            DEPLOY_PATH='/home/ampecportal/tec-flow.ampecportal.com'
          fi
          echo 'Deployment target selected; validating the existing cPanel application.'
          BOOTSTRAP='if command -v python3.11 >/dev/null 2>&1; then exec python3.11 "$@"; else exec python3 "$@"; fi'
          printf -v TARGET_COMMAND '%q ' sh -c "$BOOTSTRAP" tec-deploy - --site-url "$SITE_URL" --root "$DEPLOY_PATH" --action inspect
          ssh -i ~/.ssh/tec_conest_deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "$TARGET_COMMAND" < tools/cpanel_target.py > "$RUNNER_TEMP/tec-deploy-target.json"
          python - "$RUNNER_TEMP/tec-deploy-target.json" <<'PY'
          import json, os, sys
          from pathlib import PurePosixPath
          target = json.load(open(sys.argv[1], encoding='utf-8'))
          root = target.get('root')
          interpreter = target.get('passenger_python', '')
          for value in (root, interpreter):
              if not isinstance(value, str) or any(ord(c) < 32 or ord(c) == 127 for c in value):
                  raise SystemExit('Invalid deployment target response; nothing was uploaded.')
          if not root or not PurePosixPath(root).is_absolute() or root == '/':
              raise SystemExit('Invalid application root; nothing was uploaded.')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('DEPLOY_PATH=' + root + '\n')
              output.write('PASSENGER_PYTHON=' + interpreter + '\n')
          print('Validated the existing TEC Flow application folder.')
          print('Target selection: ' + target.get('detection', 'explicit'))
          PY
          python tools/check_uploaded_release.py create --root . \
            --output "$RUNNER_TEMP/tec-release-manifest.json"
          python - "$RUNNER_TEMP/tec-deploy-target.json" "$RUNNER_TEMP/tec-release-manifest.json" "$RUNNER_TEMP/tec-host.filter" <<'PY'
          import json, sys
          from pathlib import Path
          from tools.cpanel_target import TargetError, rsync_filter_rules
          target = json.loads(Path(sys.argv[1]).read_text())
          manifest = json.loads(Path(sys.argv[2]).read_text())
          try:
              rules = rsync_filter_rules(target, manifest['files'])
          except TargetError as error:
              raise SystemExit('Deployment target: ' + str(error))
          Path(sys.argv[3]).write_text('\n'.join(rules) + '\n')
          PY

      # The application creates a protected SQLite snapshot immediately before
      # migrating the REAL runtime database. No deployment step copies a .db.

      - name: Upload application code
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"

          rsync -az --checksum --protect-args --delete \
            -e "ssh -i ~/.ssh/tec_conest_deploy_key -p $PORT" \
            --filter "merge $RUNNER_TEMP/tec-host.filter" \
            --exclude 'node_modules/' \
            --exclude '/tenders_frontend/public/assets/ocr-v6.0.1/' \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.db' \
            --exclude '*.db-*' \
            --exclude '*.db.*' \
            --exclude '*.sqlite*' \
            --exclude '.github/' \
            --exclude '.well-known/' \
            --exclude '/.htaccess' \
            --exclude 'passenger_wsgi.py' \
            --exclude 'venv/' \
            --exclude '.venv/' \
            --exclude 'tmp/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.log' \
            --exclude 'data/' \
            --exclude 'data/conest_catalog.db' \
            --exclude 'data/conest_catalog.db-wal' \
            --exclude 'data/conest_catalog.db-shm' \
            --exclude 'data/conest_catalog.db-journal' \
            --exclude 'data/backups/' \
            --exclude 'data/imports/' \
            --exclude 'data/exports/' \
            --exclude 'data/import_previews/' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"

      - name: Verify uploaded release files
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          BOOTSTRAP='if command -v python3.11 >/dev/null 2>&1; then exec python3.11 "$@"; else exec python3 "$@"; fi'
          printf -v VERIFY_COMMAND '%q ' sh -c "$BOOTSTRAP" tec-deploy "$DEPLOY_PATH/tools/check_uploaded_release.py" verify --root "$DEPLOY_PATH"
          ssh -i ~/.ssh/tec_conest_deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "$VERIFY_COMMAND" < "$RUNNER_TEMP/tec-release-manifest.json"

      - name: Install production dependencies and restart Passenger
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"

          printf -v INSTALL_COMMAND 'cd %q && env CONEST_PASSENGER_PYTHON=%q sh tools/install_runtime.sh' \
            "$DEPLOY_PATH" "${PASSENGER_PYTHON:-}"
          ssh -i ~/.ssh/tec_conest_deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" "$INSTALL_COMMAND"
          BOOTSTRAP='if command -v python3.11 >/dev/null 2>&1; then exec python3.11 "$@"; else exec python3 "$@"; fi'
          printf -v RESTART_COMMAND '%q ' sh -c "$BOOTSTRAP" tec-deploy - --site-url "$SITE_URL" --root "$DEPLOY_PATH" --action restart
          ssh -i ~/.ssh/tec_conest_deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "$RESTART_COMMAND" < tools/cpanel_target.py > "$RUNNER_TEMP/tec-restart-result.json"
          echo 'Passenger restart requested for the validated application.'

      - name: Verify automatic migration and production health
        run: |
          set -euo pipefail
          EXPECTED_RELEASE="$(python -c 'from conest_app import __version__; print(__version__)')"
          MATCHES=0
          for ATTEMPT in $(seq 1 18); do
            HEALTH_URL="${SITE_URL%/}/api/health?check=tenders&deployment=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}&attempt=$ATTEMPT"
            if RESPONSE="$(curl --fail-with-body -sS --connect-timeout 15 --max-time 60 \
              -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' "$HEALTH_URL")"; then
              if printf '%s' "$RESPONSE" | python tools/check_deployment_health.py --require-tenders --explain; then
                MATCHES=$((MATCHES + 1))
                if [ "$MATCHES" -ge 2 ]; then
                  echo "Release $EXPECTED_RELEASE passed two fresh health checks; runtime databases and Tender startup are ready."
                  exit 0
                fi
              else
                MATCHES=0
              fi
            else
              MATCHES=0
              echo 'The website did not return a successful HTTP health response.'
            fi
            echo "Waiting for release $EXPECTED_RELEASE at $SITE_URL (attempt $ATTEMPT/18)."
            sleep 5
          done
          echo "Uploaded release files were verified, but the website did not confirm release $EXPECTED_RELEASE." >&2
          echo 'For a release mismatch, check the website binding and restart this application in cPanel. For a startup/schema error, check Passenger logs. Keep the version check enabled.' >&2
          exit 1

      - name: Schedule daily database backups
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          printf -v BACKUP_COMMAND 'cd %q && env CONEST_PASSENGER_PYTHON=%q sh tools/install_backup_cron.sh' \
            "$DEPLOY_PATH" "${PASSENGER_PYTHON:-}"
          ssh -i ~/.ssh/tec_conest_deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "$BACKUP_COMMAND"
