# Apache 2.4 / cPanel: keep this block alongside the host's Passenger settings.
# Application downloads use authenticated /api routes; private files never do.
Options -Indexes
RewriteEngine On

# Permit ACME challenges, but never serve hidden files or source-control data.
RewriteRule (^|/)\.(?!well-known(?:/|$)) - [F,L]
RewriteRule ^(?:conest_app|data|backups|tests|tools|security|docs|tenders_frontend|tenders_web|node_modules|venv|__pycache__|tmp)(?:/|$) - [F,L,NC]

# Allow only the flat public asset formats used by the application. Keep the
# deliberately public sample estimate; arbitrary JSON/data files are private.
RewriteCond %{REQUEST_FILENAME} -f
RewriteRule ^assets/(?!(?:[^/]+\.(?:js|css|svg|png|jpe?g|webp|gif|ico|woff2?|ttf)|example_project\.json)$) - [F,L,NC]

# All other physical application files are private. This covers future secret
# formats as well as Python, databases, source maps, logs, exports and archives.
# Virtual /api exports and backup operations still reach authenticated routes.
RewriteCond %{REQUEST_FILENAME} -f
RewriteRule ^(?!(?:assets|\.well-known)(?:/|$)) - [F,L,NC]
